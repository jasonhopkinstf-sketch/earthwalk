[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=EarthWalk
ProjectVersion=0.2.32
ProjectDisplayedTitle=NSLOCTEXT("", "EarthWalkTitle", "EarthWalk")

[/Script/EarthWalk.EarthWalkSettings]
; Keep the quotes: Unreal reads an unquoted // as the start of a comment.
ServerUrl="https://earthwalk.onrender.com"
PlayerName=Guest
Avatar=fox
Room=family
StartLatitude=48.8583
StartLongitude=2.2945
ViewRadiusChunks=2
; /world auto: fly above the first height (metres over the ground) to see Google's photographic tiles;
; the generated world comes back below the second.
PhotoAboveMeters=60
PhotoBelowMeters=45
; The drawn look (ink outlines and flat light). InkTuning tries other values for M_EarthInk settings,
; for example InkTuning=(("InkWidth", 2.0),("Band1", 0.8)).
bInkOutlines=True
; The painted sky with its drawn sun and cartoon clouds. False brings the engine's own sky back.
bPaintedSky=True
; Google Map Tiles API key for the photographic world (/world photo). A key written here ships with
; the game, so prefer typing /mapskey <key> in the game (kept on that PC only) or -EWMapsKey= on the
; command line. Empty keeps the photographic world off.
GoogleMapTilesKey=

[/Script/UnrealEd.ProjectPackagingSettings]
; These engine assets are loaded by path from C++, so make sure packaged builds include them.
+MapsToCook=(FilePath="/Engine/Maps/Entry")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineFonts")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineMaterials")
; The world materials and textures, loaded by path from C++.
+DirectoriesToAlwaysCook=(Path="/Game/EarthWalk")
; The Cesium plugin is for the editor build only (EarthWalk.uproject). On a PC that has it, its own
; assets are loaded while packaging and must not go into the standalone game, which cannot use them.
+DirectoriesToNeverCook=(Path="/CesiumForUnreal")
+DirectoriesToNeverCook=(Path="/Game/CesiumSettings")
