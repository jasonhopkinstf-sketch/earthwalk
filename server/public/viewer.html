<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EarthWalk chunk viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec7e8; font: 13px system-ui, sans-serif; }
  #bar { position: fixed; top: 8px; left: 8px; background: rgba(20, 24, 28, .78); color: #fff; padding: 8px 10px; border-radius: 6px; }
  #bar input { width: 220px; }
  #status { margin-top: 4px; opacity: .8; }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="bar">
  <form id="go"><input id="q" placeholder="Place or lat, lon"> <button>Go</button></form>
  <div id="status">Loading</div>
  <div style="opacity:.6;margin-top:2px">Map data © OpenStreetMap contributors</div>
</div>
<script type="module">
// Debug viewer for the world server: decodes the same EWC1 chunks the game client uses.
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const Z = 16;
const params = new URLSearchParams(location.search);
let lat = parseFloat(params.get("lat") ?? "48.8583");
let lon = parseFloat(params.get("lon") ?? "2.2945");
// On a server with an access code, open this page as /viewer.html?code=...
const auth = params.get("code") ? `?code=${encodeURIComponent(params.get("code"))}` : "";
const radius = Math.min(4, parseInt(params.get("r") ?? "1", 10));

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec7e8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(-0.5, 1, 0.35);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(55, 1, 1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
const world = new THREE.Group();
scene.add(world);
const status = document.getElementById("status");

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const lonToX = (v) => ((v + 180) / 360) * 2 ** Z;
const latToY = (v) => ((1 - Math.asinh(Math.tan((v * Math.PI) / 180)) / Math.PI) / 2) * 2 ** Z;

function decode(buf, ox, oy, S0) {
  const dv = new DataView(buf);
  if (dv.getUint32(0, true) !== 0x31435745) throw new Error("not an EWC1 chunk");
  const cx = dv.getUint32(8, true), cy = dv.getUint32(12, true), count = dv.getUint32(20, true);
  let o = 24;
  const group = new THREE.Group();
  for (let s = 0; s < count; s++) {
    const color = dv.getUint32(o + 4, true), nv = dv.getUint32(o + 12, true), ni = dv.getUint32(o + 16, true);
    o += 20;
    const pos = new Float32Array(nv * 3), nrm = new Float32Array(nv * 3), idx = new Uint32Array(ni);
    for (let i = 0; i < nv; i++, o += 12) {
      // three.js is right-handed with y up: x = east, y = height, z = south.
      pos[i * 3] = (cx + dv.getFloat32(o, true) - ox) * S0;
      pos[i * 3 + 1] = dv.getFloat32(o + 8, true);
      pos[i * 3 + 2] = (cy + dv.getFloat32(o + 4, true) - oy) * S0;
    }
    for (let i = 0; i < nv; i++, o += 12) {
      nrm[i * 3] = dv.getFloat32(o, true);
      nrm[i * 3 + 1] = dv.getFloat32(o + 8, true);
      nrm[i * 3 + 2] = -dv.getFloat32(o + 4, true);
    }
    for (let i = 0; i < ni; i++, o += 4) idx[i] = dv.getUint32(o, true);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("normal", new THREE.BufferAttribute(nrm, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    const m = new THREE.MeshLambertMaterial({ color: new THREE.Color(((color >>> 24) & 255) / 255, ((color >>> 16) & 255) / 255, ((color >>> 8) & 255) / 255) });
    group.add(new THREE.Mesh(g, m));
  }
  return group;
}

async function load() {
  world.clear();
  const ox = lonToX(lon), oy = latToY(lat);
  const S0 = (40075016.686 * Math.cos((lat * Math.PI) / 180)) / 2 ** Z;
  let done = 0, failed = 0, groundY = null;
  const jobs = [];
  for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++) {
    const x = Math.floor(ox) + dx, y = Math.floor(oy) + dy;
    jobs.push(fetch(`/v1/chunk/${Z}/${x}/${y}${auth}`).then(async (r) => {
      if (!r.ok) throw new Error(r.status);
      const group = decode(await r.arrayBuffer(), ox, oy, S0);
      world.add(group);
      if (dx === 0 && dy === 0) groundY = new THREE.Box3().setFromObject(group).min.y;
      done++;
    }).catch(() => { failed++; }).finally(() => { status.textContent = `${done}/${jobs.length} chunks${failed ? `, ${failed} failed` : ""} · ${lat.toFixed(5)}, ${lon.toFixed(5)}`; }));
  }
  await Promise.all(jobs);
  // `up` looks at a point so many metres above the lowest ground of the middle chunk (a bridge, a rooftop).
  const y = (groundY ?? 0) + parseFloat(params.get("up") ?? "0");
  controls.target.set(0, y, 0);
  const tilt = parseFloat(params.get("tilt") ?? "0.75"), dist = parseFloat(params.get("dist") ?? "520");
  const az = parseFloat(params.get("az") ?? "0.5");
  camera.position.set(Math.sin(az) * dist * Math.cos(tilt), y + dist * Math.sin(tilt), Math.cos(az) * dist * Math.cos(tilt));
  document.title = failed ? "EarthWalk viewer (errors)" : "EarthWalk viewer (ready)";
}

document.getElementById("go").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch(`/v1/geocode?q=${encodeURIComponent(document.getElementById("q").value)}${auth.replace("?", "&")}`);
  if (!r.ok) { status.textContent = "Place not found"; return; }
  ({ lat, lon } = await r.json());
  load();
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
load();
</script>
</body>
</html>
